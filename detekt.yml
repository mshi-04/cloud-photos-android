complexity:
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 30
  LongMethod:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9_]*'
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
